<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel — {marca}</title>
  <link rel="preload" href="/fonts/TikTokSans.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/marca.css">
  <link rel="icon" href="/img/perfil.webp">
  <style>
    .fila-partido { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr auto; gap: 6px; margin-bottom: 8px; align-items: center; }
    .fila-partido > * { min-width: 0; }
    .fila-3 { grid-template-columns: 1fr 1fr 1fr 1fr; }
    .marcador { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .marcador input[type=number] { width: 64px; text-align: center; padding: 8px; }
    @media (max-width: 620px) { .fila-partido { grid-template-columns: 1fr 1fr; } .fila-3 { grid-template-columns: 1fr; } .fila-partido .empate { grid-column: 1 / -1; } }
    .empate { display: flex; gap: 6px; align-items: center; font-size: .85rem; white-space: nowrap; }
    .empate input { width: 18px; height: 18px; accent-color: var(--amarillo); }
    .entrada { border-top: 1px solid var(--line); padding: 12px 0; }
    .entrada.gana { background: rgba(255,221,0,.08); }
    .alerta { color: #ffb3b6; font-size: .85rem; }
    .mini-btn { padding: 6px 12px; font-size: .85rem; }
    .lista-q a { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--txt); }
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="wrap" id="app" style="margin-top:20px"></main>
  <div id="footer"></div>

  <script src="/js/config.js"></script>
  <script src="/js/common.js"></script>
  <script>
  (async function () {
    const esc = MC.esc, app = document.getElementById("app");
    const $ = (id) => document.getElementById(id);
    const pesos = (n) => "$" + Number(n).toLocaleString("es-MX");
    const NOM = { L: "Local", E: "Empate", V: "Visita", C: "Cancelado" };
    MC.montar("");

    function login(msg) {
      app.innerHTML = `<section class="card" style="max-width:420px;margin:0 auto">
        <h2 class="titulo-sec">Panel del administrador</h2>
        <form id="f" class="form"><input type="password" id="pw" placeholder="Contraseña del panel" autocomplete="current-password">
        <div class="error" id="err" ${msg ? "" : "hidden"}>${esc(msg || "")}</div>
        <button class="btn btn-pri">Entrar</button></form></section>`;
      $("f").onsubmit = async (e) => {
        e.preventDefault();
        try { await MC.api("POST", "/api/admin/entrar", { password: $("pw").value }); inicio(); }
        catch (err) { login(err.message); }
      };
    }

    async function inicio() {
      let d;
      try { d = await MC.api("GET", "/api/admin/quinielas"); } catch (e) { return login(e.estado === 401 ? "" : e.message); }
      const manana = new Date(Date.parse(d.hoy + "T12:00:00Z") + 86400000).toISOString().slice(0, 10);
      const tieneHoy = d.quinielas.some((q) => q.fecha === d.hoy);
      app.innerHTML = `
        <section class="card" id="embudo"><h2 class="titulo-sec">📊 ¿Cómo va la gente?</h2><p>Cargando…</p></section>
        <section class="card">
          <h2 class="titulo-sec">Quinielas</h2>
          <div class="lista-q">${d.quinielas.map((q) => `<a href="#q${q.id}" data-id="${q.id}">
            <span><b>${esc(q.fecha)}</b>${q.fecha === d.hoy ? ' <span class="badge amarillo">HOY</span>' : ""}${q.auto ? ' <span class="badge gris">auto</span>' : ""}</span>
            <span>${q.entradas} quinielas · ${q.calificada ? '<span class="badge verde">Calificada</span>' : '<span class="badge gris">Sin resultados</span>'}</span></a>`).join("") || "<p>Aún no hay quinielas.</p>"}</div>
          <div class="fila" style="margin-top:14px"><button class="btn btn-sec" id="ver-usuarios">Ver usuarios</button></div>
        </section>
        <section class="card" id="auto"><h2 class="titulo-sec">🤖 Automático</h2><p>Cargando…</p></section>
        <section class="card">
          <h2 class="titulo-sec">Publicar nueva quiniela</h2>
          <form id="nueva" class="form">
            <div class="fila-partido fila-3">
              <div><label>Fecha</label><input type="date" id="n-fecha" value="${tieneHoy ? manana : d.hoy}"></div>
              <div><label>Cierre (hora de tu celular)</label><input type="datetime-local" id="n-cierre"></div>
              <div><label>Premio ($)</label><input type="number" id="n-premio" value="300" min="0"></div>
              <div><label>Premio si se cancela 1 partido ($)</label><input type="number" id="n-premio-c" value="200" min="0"></div>
            </div>
            <p class="ayuda">El cierre debe ser antes de que empiece el primer partido.</p>
            <div><label>Partidos (liga · local · visitante · hora · ¿puede haber empate?)</label>
            ${[1, 2, 3, 4, 5].map((i) => `<div class="fila-partido">
              <input type="text" placeholder="Liga" id="p${i}-liga"><input type="text" placeholder="Local ${i}" id="p${i}-local">
              <input type="text" placeholder="Visitante ${i}" id="p${i}-visita"><input type="text" placeholder="Ej. Sáb 19:00" id="p${i}-hora">
              <label class="empate"><input type="checkbox" id="p${i}-empate" checked> Puede haber empate</label></div>`).join("")}</div>
            <p class="ayuda">En futbol deja marcado "Puede haber empate". En NFL, NBA o béisbol quítalo: la gente solo verá L y V.</p>
            <div class="error" id="n-err" hidden></div>
            <button class="btn btn-pri">Publicar quiniela</button>
          </form>
        </section>`;
      document.querySelectorAll(".lista-q a").forEach((a) => a.onclick = (e) => { e.preventDefault(); detalle(a.dataset.id); });
      $("ver-usuarios").onclick = usuarios;
      cargarAutomatico();
      cargarEmbudo();
      $("nueva").onsubmit = async (e) => {
        e.preventDefault();
        const partidos = [1, 2, 3, 4, 5].map((i) => ({ liga: $(`p${i}-liga`).value, local: $(`p${i}-local`).value, visita: $(`p${i}-visita`).value, hora: $(`p${i}-hora`).value, empate: $(`p${i}-empate`).checked }))
          .filter((p) => p.local || p.visita);
        try {
          if (!$("n-cierre").value) throw new Error("Pon la hora de cierre.");
          const r = await MC.api("POST", "/api/admin/quinielas", { fecha: $("n-fecha").value, cierre: new Date($("n-cierre").value).toISOString(), premio: $("n-premio").value, premio_cancelado: $("n-premio-c").value, partidos });
          detalle(r.id);
        } catch (err) { $("n-err").textContent = err.message; $("n-err").hidden = false; }
      };
    }

    async function detalle(id) {
      let d;
      try { d = await MC.api("GET", `/api/admin/quinielas/${id}`); } catch (e) { return login(e.message); }
      const q = d.quiniela, ganan = new Map(d.ganadores.map((g) => [g.entrada_id, g.monto]));
      const conAlerta = d.entradas.filter((e) => e.alertas.length).length;
      app.innerHTML = `
        <p><a href="#" id="volver">← Volver</a></p>
        <section class="card">
          <h2 class="titulo-sec">Quiniela del ${esc(q.fecha)}</h2>
          <p>Cierre: ${esc(new Date(q.cierre).toLocaleString("es-MX", { timeZone: "America/Mexico_City" }))} · Premio ${pesos(q.premio)} (${pesos(q.premio_cancelado)} si se cancela 1) · ${d.entradas.length} quinielas</p>
          <h3>Resultados (marcador al final de los 90 minutos + reposición)</h3>
          ${d.partidos.map((p) => `<div class="partido" style="grid-template-columns:1fr auto">
            <div>${p.liga ? `<small class="amarillo">${esc(p.liga)}</small><br>` : ""}<b>${esc(p.local)}</b> vs <b>${esc(p.visita)}</b>${p.empate ? "" : ' <span class="badge gris">sin empate</span>'}${p.resultado ? ` <span class="badge verde">${p.resultado}</span>` : ""}</div>
            <div class="marcador">
              <input type="number" min="0" id="gl-${p.id}" value="${p.goles_local ?? ""}" aria-label="Goles ${esc(p.local)}" ${p.resultado === "C" ? "disabled" : ""}> -
              <input type="number" min="0" id="gv-${p.id}" value="${p.goles_visita ?? ""}" aria-label="Goles ${esc(p.visita)}" ${p.resultado === "C" ? "disabled" : ""}>
              <label class="empate"><input type="checkbox" id="c-${p.id}" ${p.resultado === "C" ? "checked" : ""}> Cancelado</label>
            </div>
          </div>`).join("")}
          <div class="fila" style="margin-top:12px"><button class="btn btn-pri" id="guardar">Guardar resultados y calificar</button>
          <button class="btn btn-sec" id="borrar">🗑️ Borrar quiniela</button></div>
          <p class="ayuda">Se califica sola cuando todos los partidos tienen marcador o están cancelados. Cancelado cuenta como acierto para todos; 1 cancelado baja el premio y 2 o más anulan la quiniela.</p>
        </section>
        <section class="card">
          <h2 class="titulo-sec">Ganadores</h2>
          ${d.reglas.anulada ? `<div class="error">Quiniela anulada: se cancelaron ${d.reglas.cancelados} partidos. No hay premio.</div>`
            : q.calificada ? (d.ganadores.length ? `<p>🏆 Gana <b>${esc((d.entradas.find((e) => e.id === d.ganadores[0].entrada_id) || {}).apodo || "")}</b> · ${pesos(d.ganadores[0].monto)}${d.reglas.cancelados ? " (premio reducido por partido cancelado)" : ""}.
              ${d.ganadores[0].empatados > 1 ? `Hubo ${d.ganadores[0].empatados} con todos los aciertos: se desempató por total de goles (${d.reglas.total_goles}); se quedó a ${d.ganadores[0].diferencia ?? "?"} de diferencia.` : ""} Pide su INE antes de pagar.</p>` : "<p>Nadie le atinó a todos.</p>")
            : "<p>Aún sin resultados.</p>"}
        </section>
        <section class="card">
          <h2 class="titulo-sec">Quinielas recibidas</h2>
          ${conAlerta ? `<p class="alerta">⚠️ ${conAlerta} con señales para revisar. Una misma IP puede ser la misma red celular: revisa antes de anular.</p>` : ""}
          ${d.entradas.map((e) => `<div class="entrada ${ganan.has(e.id) ? "gana" : ""}">
            <b>${esc(e.apodo)}</b> · ${esc(e.nombre)} · <a href="https://wa.me/52${esc(e.telefono)}" target="_blank" rel="noopener">${esc(e.telefono)}</a>
            ${ganan.has(e.id) ? `<span class="badge amarillo">GANA ${pesos(ganan.get(e.id))}</span>` : ""}
            ${e.anulada ? '<span class="badge rojo">ANULADA</span>' : ""}${e.bloqueado ? ' <span class="badge rojo">CUENTA BLOQUEADA</span>' : ""}
            <br><small>${d.partidos.map((p) => `${esc(e.picks[p.id])}`).join(" · ")} · desempate: <b>${e.goles ?? "—"} goles</b> ${e.aciertos !== null ? `· <b>${e.aciertos} aciertos</b>` : ""} · enviada ${esc(e.creado)} UTC · IP ${esc(e.ip)}</small>
            ${e.alertas.map((a) => `<div class="alerta">⚠️ ${esc(a)}</div>`).join("")}
            <div class="fila" style="justify-content:flex-start;margin-top:6px">
              <button class="btn btn-sec mini-btn" data-acc="anular" data-id="${e.id}" data-v="${e.anulada ? 0 : 1}">${e.anulada ? "Quitar anulación" : "Anular"}</button>
              ${ganan.has(e.id) ? `<button class="btn btn-sec mini-btn" data-acc="pagado" data-id="${e.id}" data-v="${e.pagado ? 0 : 1}">${e.pagado ? "✅ Pagado (deshacer)" : "Marcar pagado"}</button>
              <a class="btn btn-wa mini-btn" target="_blank" rel="noopener" href="https://wa.me/52${esc(e.telefono)}?text=${encodeURIComponent(`¡Hola ${e.apodo}! 😎 Soy ${CONFIG.firma}: le atinaste a todos los partidos de la quiniela del ${q.fecha} y ganaste ${pesos(ganan.get(e.id))}. Para entregarte tu premio mándame foto de tu INE y la cuenta (CLABE) a tu nombre.`)}">Avisarle</a>` : ""}
              <button class="btn btn-sec mini-btn" data-acc="bloquear" data-id="${e.usuario_id}" data-v="${e.bloqueado ? 0 : 1}">${e.bloqueado ? "Desbloquear cuenta" : "Bloquear cuenta"}</button>
            </div></div>`).join("") || "<p>Todavía no llegan quinielas.</p>"}
        </section>`;
      $("volver").onclick = (ev) => { ev.preventDefault(); inicio(); };
      $("guardar").onclick = async () => {
        const marcadores = Object.fromEntries(d.partidos.map((p) => [p.id, $(`c-${p.id}`).checked ? { cancelado: true } : { local: $(`gl-${p.id}`).value, visita: $(`gv-${p.id}`).value }]));
        try { await MC.api("POST", `/api/admin/quinielas/${id}/resultados`, { marcadores }); detalle(id); } catch (err) { alert(err.message); }
      };
      d.partidos.forEach((p) => $(`c-${p.id}`).onchange = (ev) => { $(`gl-${p.id}`).disabled = $(`gv-${p.id}`).disabled = ev.target.checked; });
      $("borrar").onclick = async () => {
        const n = d.entradas.length;
        if (!confirm(`¿Borrar la quiniela del ${q.fecha}?` + (n ? `\n\n⚠️ Ya hay ${n} quiniela(s) enviada(s) y se van a perder.` : ""))) return;
        if (n && !confirm(`¿Seguro? Se borrarán las ${n} quinielas que ya mandó la gente. Esto no se puede deshacer.`)) return;
        try {
          await MC.api("DELETE", `/api/admin/quinielas/${id}${n ? "?forzar=1" : ""}`);
          if (confirm("Quiniela borrada.\n\n¿Quieres que el sistema arme otra automáticamente con partidos nuevos? (si todavía hay partidos ese día)")) {
            try { await MC.api("POST", "/api/admin/automatico/ahora", {}); } catch (e) { alert(e.message); }
          }
          inicio();
        } catch (err) { alert(err.message); }
      };
      document.querySelectorAll("[data-acc]").forEach((b) => b.onclick = async () => {
        const v = b.dataset.v === "1";
        try {
          if (b.dataset.acc === "bloquear") {
            if (v && !confirm("¿Bloquear esta cuenta? Ya no podrá entrar ni jugar.")) return;
            await MC.api("POST", `/api/admin/usuarios/${b.dataset.id}`, { bloqueado: v });
          } else await MC.api("POST", `/api/admin/entradas/${b.dataset.id}`, { [b.dataset.acc === "anular" ? "anulada" : "pagado"]: v });
          detalle(id);
        } catch (err) { alert(err.message); }
      });
    }

    async function cargarEmbudo() {
      let e;
      try { e = await MC.api("GET", "/api/admin/embudo"); } catch (err) { return; }
      const t = e.total, dc = e.discord || {};
      const pct = (a, b) => (b ? Math.round(a * 100 / b) + "%" : "—");
      const pasos = [
        ["👀 Visitaron la página", t.visitantes, null],
        ["📝 Crearon cuenta", t.cuentas, t.visitantes],
        ["⚽ Jugaron la quiniela", t.jugaron, t.cuentas],
        ["🔁 Jugaron 3 días o más", t.volvieron, t.jugaron],
        ["👆 Dieron clic en Discord", t.clic_discord, t.visitantes],
      ];
      if (dc.usos_invitacion !== undefined && dc.usos_invitacion !== null) pasos.push(["🎮 Entraron al Discord con el enlace de la página (total histórico)", dc.usos_invitacion, null]);
      const max = Math.max(1, ...pasos.map((p) => p[1]));
      const fecha = (f) => new Date(f + "T12:00:00").toLocaleDateString("es-MX", { weekday: "short", day: "numeric" });
      $("embudo").innerHTML = `<h2 class="titulo-sec">📊 ¿Cómo va la gente?</h2>
        <p style="margin:0 0 10px">Últimos 7 días (personas distintas)${dc.miembros ? ` · <b>${dc.miembros}</b> miembros en tu Discord en total` : ""}</p>
        ${pasos.map(([nom, n, base]) => `<div style="margin:8px 0">
          <div style="display:flex;justify-content:space-between;gap:8px"><span>${nom}</span><b>${n}${base !== null ? ` <span style="color:var(--muted);font-weight:600">(${pct(n, base)})</span>` : ""}</b></div>
          <div style="height:10px;background:var(--card2);border-radius:99px;overflow:hidden"><div style="height:100%;width:${Math.round(n * 100 / max)}%;background:var(--amarillo)"></div></div>
        </div>`).join("")}
        <p class="ayuda">El % compara con el paso de arriba (el de Discord compara con quienes visitaron). "Entraron al Discord" es el total desde que se creó el enlace (incluye a quien lo usó fuera de la página).</p>
        <details><summary style="cursor:pointer;color:var(--amarillo);font-weight:700">Ver por día</summary>
          <div style="overflow-x:auto"><table><thead><tr><th>Día</th><th>Visitas</th><th>Cuentas</th><th>Jugaron</th><th>Clic Discord</th></tr></thead><tbody>
          ${e.dias.slice().reverse().map((d) => `<tr><td>${esc(fecha(d.fecha))}</td><td>${d.visitantes}</td><td>${d.cuentas}</td><td>${d.jugaron}</td><td>${d.clic_discord}</td></tr>`).join("")}
          </tbody></table></div></details>`;
    }

    async function cargarAutomatico() {
      let a;
      try { a = await MC.api("GET", "/api/admin/automatico"); } catch (e) { return; }
      const iconos = { quiniela: "📋", resultado: "⚽", ganador: "🏆", calificada: "✅", aviso: "⚠️", error: "❌", inicio: "🔌" };
      const hora = (t) => new Date(t.replace(" ", "T") + "Z").toLocaleString("es-MX", { timeZone: "America/Mexico_City", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
      $("auto").innerHTML = `<h2 class="titulo-sec">🤖 Automático</h2>
        ${a.activo ? `<div class="exito">Encendido: la quiniela de mañana se publica sola cada tarde y los resultados se califican solos.</div>`
          : a.copia ? `<div class="exito">Esta página copia la quiniela de la otra página del servidor: mismos partidos, cierre y resultados. Los jugadores y ganadores son aparte.</div>`
          : `<div class="aviso">Apagado: falta la clave de API-Football en el servidor.</div>`}
        <div class="fila" style="justify-content:flex-start;margin:12px 0"><button class="btn btn-sec mini-btn" id="auto-ahora" ${a.activo || a.copia ? "" : "disabled"}>Revisar ahora</button></div>
        <div>${a.log.map((l) => `<div style="padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem">
          ${iconos[l.tipo] || "•"} <span style="color:var(--muted)">${esc(hora(l.creado))}</span> · ${esc(l.mensaje)}</div>`).join("") || "<p>Sin actividad todavía.</p>"}</div>`;
      if ($("auto-ahora")) $("auto-ahora").onclick = async (e) => {
        e.target.disabled = true; e.target.textContent = "Revisando…";
        try { await MC.api("POST", "/api/admin/automatico/ahora", {}); } catch (err) { alert(err.message); }
        inicio();
      };
    }

    async function usuarios() {
      let d;
      try { d = await MC.api("GET", "/api/admin/usuarios"); } catch (e) { return login(e.message); }
      app.innerHTML = `<p><a href="#" id="volver">← Volver</a></p>
        <section class="card"><h2 class="titulo-sec">Usuarios (${d.total})</h2>
        <div style="overflow-x:auto"><table><thead><tr><th>Apodo</th><th>Nombre</th><th>Celular</th><th>Quinielas</th><th>Invitó</th><th>Alta</th><th>Revisar</th></tr></thead><tbody>
        ${d.usuarios.map((u) => `<tr><td>${esc(u.apodo)}${u.bloqueado ? ' <span class="badge rojo">Bloq.</span>' : ""}</td><td>${esc(u.nombre)}</td>
          <td><a href="https://wa.me/52${esc(u.telefono)}" target="_blank" rel="noopener">${esc(u.telefono)}</a></td><td>${u.quinielas}</td><td>${u.invitados}</td>
          <td>${esc(u.creado.slice(0, 10))}</td><td>${u.cuentas_misma_ip > 1 ? `<span class="alerta">${u.cuentas_misma_ip} cuentas misma IP</span>` : ""}</td></tr>`).join("")}
        </tbody></table></div></section>`;
      $("volver").onclick = (ev) => { ev.preventDefault(); inicio(); };
    }

    inicio();
  })();
  </script>
</body>
</html>
